<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <title style>Document</title>
  <style>

    /* Common styles NE PAS MODIFIER */
    body, html{
      padding:0;
      margin:0;
      background:#999;
      width:100%;
      min-height:100vh;
    }
    header{
      background:#feb;
    }
    article{
      background:#dd8;
    }
    nav{
      background:#ccf;
    }
    aside{
      background:#ccf;
    }
    footer{
      background:#feb;
    }
    header, article, nav, aside, footer{
      border-radius:5px;
      padding:5px;
    }

    /* Votre code CSS pour design par Grid ci-après */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .container {
      display: grid;
      width: 100%;
      max-width: 1200px;
      min-height: 90vh;
      gap: 10px;
      grid-template-columns: 200px 1fr 200px;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "header  header  header"
        "nav     article aside"
        "footer  footer  footer";
      grid-auto-flow: row;
      grid-auto-rows: minmax(100px, auto);
      grid-auto-columns: minmax(100px, auto);
    }

    header, article, nav, aside, footer {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bolder;
      grid-gap: 10px;
      
    }

    header  { grid-area: header;}
    nav     { grid-area: nav; }
    article { grid-area: article; }
    aside   { grid-area: aside; }
    footer  { grid-area: footer; }

    @media screen and (max-width: 768px) {
      .container {
        grid-template-columns: 80px 1fr 80px;
        font-size: 0.85rem;
         grid-template-areas:
          "header  header  header"
          "nav     article aside"
          "footer  footer  footer";
      
      
      }
    }

  </style>
</head>
<!-- NE PAS MODIFIER LE CODE CI-APRES -->
<body>
  <div class="container">

    <header>Header</header>
    <article>Article</article>
    <nav>Navigation</nav>
    <aside>Aside</aside>
    <footer>Footer</footer>
  </div>
</body>
</html>
